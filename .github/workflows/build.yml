name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests (ISO reader, plain JVM)
        run: scripts/test.sh

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;22.1.7171670" "cmake;3.22.1" "platforms;android-30" "build-tools;30.0.3" > /dev/null

      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: third_party/downloads
          key: upstream-${{ hashFiles('winlator.lock') }}

      - name: Prepare project
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        working-directory: third_party/winlator
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp third_party/winlator/app/build/outputs/apk/debug/app-debug.apk \
             "out/Jerusalem-Android-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Jerusalem-Android
          path: out/*.apk
