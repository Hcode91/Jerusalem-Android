apply plugin: 'com.android.application'

android {
    compileSdk 30

    defaultConfig {
        // Own application id so it installs alongside a normal Winlator.
        // The Java package stays com.winlator (the R class lives there).
        applicationId 'io.github.hcode91.jerusalem'
        minSdkVersion 26
        // Must stay <= 28: newer targets forbid executing binaries from app
        // storage, which is how Winlator runs proot/box64/wine.
        targetSdkVersion 28
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Fixed, committed debug key so each CI build installs over the last one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    ndkVersion '22.1.7171670'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
